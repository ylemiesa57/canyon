<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in to Canyon</title>
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800;1,62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-page { min-height: 100svh; display: grid; place-items: center; padding: var(--gutter); }
    .login-card { width: min(420px, 100%); display: grid; gap: 22px; }
    .login-card .brand { font-size: 1.4rem; }
    .login-card .brand-mark { width: 22px; height: 22px; }
    .login-card h1 { font-size: 1.75rem; font-stretch: 112%; }
    .login-foot { color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .login-foot a { color: var(--text); }
    .login-sub { color: var(--muted); font-size: 1rem; line-height: 1.5; margin-top: -8px; }
    .login-close {
      position: fixed; top: var(--gutter); right: var(--gutter);
      width: 36px; height: 36px; display: grid; place-items: center;
      border-radius: 50%; color: var(--muted); text-decoration: none;
      font-size: 1.4rem; line-height: 1; transition: background 0.15s ease, color 0.15s ease;
    }
    .login-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  </style>
</head>
<body>
<main class="login-page">
  <a class="login-close" href="index.html" aria-label="Close and return to Canyon home">&times;</a>
  <div class="login-card">
    <a class="brand" href="index.html" aria-label="Canyon home">
      <img class="brand-mark" src="assets/logo-mark.png" alt="" width="18" height="18">
      Canyon
    </a>
    <h1>Log in</h1>
    <p class="login-sub">No password. We email you a link that signs you in.</p>
    <form class="form" id="login-form" novalidate>
      <div class="form-fields" style="display:grid;gap:16px">
        <div class="field">
          <label for="login-email">Work email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required>
          <span class="error">Enter a valid email address.</span>
        </div>
        <button class="btn btn-primary btn-lg" type="submit">Email me a sign-in link</button>
      </div>
      <div class="form-done" role="status">
        <strong>Check your inbox.</strong> We sent a sign-in link to <span id="login-done-email"></span>.
      </div>
    </form>
    <div class="login-foot">
      <span>New here? <a href="index.html#trial">Start free trial</a></span>
    </div>
  </div>
</main>
<script>
  // No backend yet: validate the address and show the confirmation, like the trial form.
  (function () {
    var form = document.getElementById("login-form");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("login-email");
      var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
      email.closest(".field").classList.toggle("is-invalid", !ok);
      if (!ok) { email.focus(); return; }
      document.getElementById("login-done-email").textContent = email.value.trim();
      form.classList.add("is-done");
    });
  })();
</script>
</body>
</html>
